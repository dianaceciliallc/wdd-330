<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | SleepOutside</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/login.mjs"></script>
  </head>
  <body>
    <header id="header" class="divider"></header>
    <div class="breadcrumbs-container">
      <ul id="breadcrumbs" class="breadcrumbs"></ul>
    </div>
    <main class="checkout-main-container auth-page">
      <h1>Sign in</h1>
      <form id="login-form" class="checkout-form">
        <div class="form-group full-width">
          <label for="login-email">Email address</label>
          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="username"
            required
          />
        </div>
        <div class="form-group full-width">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn-checkout" type="submit">Sign in</button>
      </form>
      <p class="auth-register-prompt">
        Don’t have an account?
        <a href="../register/index.html?type=registration">Register here</a>.
      </p>
    </main>
    <footer id="footer"></footer>
  </body>
</html>
