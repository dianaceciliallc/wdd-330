<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header id="header" class="divider"></header>

    <div class="breadcrumbs-container">
      <ul id="breadcrumbs" class="breadcrumbs"></ul>
    </div>

    <main class="divider">
      <section class="products cart-products">
        <h2>My Cart</h2>

        <ul class="product-list"></ul>

        <div class="cart-footer">
          <div class="cart-total">
            <span>Total:</span>
            <span class="cart-total-value"></span>
          </div>
          <a href="../checkout/index.html">
            <button class="btn-checkout">
              Checkout
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </button>
          </a>
        </div>
      </section>
      <section id="saved-items" class="products saved-products">
        <h2>Saved for Later</h2>
        <ul id="saved-items-list" class="product-list"></ul>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
