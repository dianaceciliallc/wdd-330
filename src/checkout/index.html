<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/checkout.js"></script>
  </head>

  <body>
    <header id="header" class="divider"></header>
    <div class="breadcrumbs-container">
      <ul id="breadcrumbs" class="breadcrumbs"></ul>
    </div>

    <main class="checkout-main-container">
      <h2>Review & Place your Order</h2>

      <div class="checkout-grid">
        <form id="checkoutForm" class="checkout-form">
          <section class="form-section">
            <h2>Customer & Shipping Address</h2>
            <div class="form-row">
              <div class="form-group">
                <label for="firstName">First Name</label>
                <input
                  type="text"
                  id="firstName"
                  name="fname"
                  required
                  placeholder="Jane"
                />
              </div>
              <div class="form-group">
                <label for="lastName">Last Name</label>
                <input
                  type="text"
                  id="lastName"
                  name="lname"
                  required
                  placeholder="Doe"
                />
              </div>
            </div>

            <div class="form-group full-width">
              <label for="address">Street Address</label>
              <input
                type="text"
                id="address"
                name="street"
                required
                placeholder="123 Earth Tone Lane, Apt 4B"
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input
                  type="text"
                  id="city"
                  name="city"
                  required
                  placeholder="Portland"
                />
              </div>
              <div class="form-group">
                <label for="state">State</label>
                <input
                  type="text"
                  id="state"
                  name="state"
                  required
                  pattern="[A-Za-z]{2}"
                  title="Please enter a 2-letter state code (e.g., OR)"
                  placeholder="OR"
                />
              </div>
              <div class="form-group">
                <label for="zip">Zip Code</label>
                <input
                  type="text"
                  id="zip"
                  name="zip"
                  required
                  pattern="\d{5}"
                  maxlength="5"
                  inputmode="numeric"
                  title="The zip code must contain 5 digits"
                  placeholder="97201"
                />
              </div>
            </div>
          </section>

          <section class="form-section">
            <h2>Payment Details</h2>
            <div class="form-group full-width">
              <label for="cardNumber">Credit Card Number</label>
              <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                required
                pattern="\d{13,16}"
                maxlength="16"
                inputmode="numeric"
                title="The credit card number must contain 13 to 16 digits"
                placeholder="1234567812345678"
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="expDate">Expiration Date</label>
                <input
                  type="text"
                  id="expDate"
                  name="expiration"
                  required
                  pattern="(0[1-9]|1[0-2])\/\d{2}"
                  maxlength="5"
                  inputmode="numeric"
                  title="The expiration date must be in MM/YY format"
                  placeholder="MM/YY"
                />
              </div>
              <div class="form-group">
                <label for="cvv">Security Code (CVV)</label>
                <input
                  type="password"
                  id="cvv"
                  name="code"
                  required
                  pattern="\d{3,4}"
                  maxlength="4"
                  inputmode="numeric"
                  title="The CVV must contain 3 or 4 digits"
                  placeholder="123"
                />
              </div>
            </div>
          </section>

          <button type="submit" class="btn-checkout">Complete Order</button>
        </form>

        <div class="order-summary">
          <h2>Order Summary</h2>
          <div id="orderSummary" class="order-total">
            <p>Subtotal:</p>
            <span id="orderTotal" class="total-amount"></span>
            <p>Tax:</p>
            <span id="orderTotalWithTax" class="total-amount-with-tax"></span>
            <p>Shipping Estimate:</p>
            <span id="orderShipping" class="total-amount-shipping"></span>
            <p>Order Total:</p>
            <span id="orderFinalTotal" class="total-amount"></span>
          </div>
        </div>
      </div>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
